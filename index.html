<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Centurion — dépliage papercraft</title>
    <style>
      :root {
        --bg: #f5f4f0;
        --panel: #ffffff;
        --border: #ddd8cc;
        --accent: #b0532a;
        --text: #33302a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        flex-wrap: wrap;
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header .spacer { flex: 1; }
      main { flex: 1; display: flex; min-height: 0; }
      #view3d { flex: 1; min-width: 0; position: relative; }
      #view3d canvas { display: block; }
      #pagesPanel {
        width: 44%;
        min-width: 320px;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--border);
        background: #e9e7e0;
      }
      #pagesToolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border);
        background: #f0eee8;
      }
      #pagesToolbar button {
        min-width: 34px;
        min-height: 30px;
        padding: 4px 8px;
      }
      #zoomLevel { font-size: 12.5px; color: #666; min-width: 44px; text-align: center; }
      #pagesToolbar .sep { flex: 0 0 1px; height: 22px; background: var(--border); margin: 0 4px; }
      #pagesToolbar button.pressed { background: var(--accent); border-color: var(--accent); color: white; }
      #pages {
        --zoom: 100;
        flex: 1;
        overflow: auto;
        padding: 12px;
        cursor: grab;
      }
      #pages.panning { cursor: grabbing; user-select: none; }
      .page { margin-bottom: 14px; width: calc(var(--zoom) * 1%); min-width: calc(var(--zoom) * 1%); }
      #pages.mosaic {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-content: flex-start;
      }
      #pages.mosaic .page {
        margin-bottom: 0;
        width: calc(var(--zoom) * 1% - 12px);
        min-width: calc(var(--zoom) * 1% - 12px);
      }
      .page-title { font-size: 12px; color: #777; margin-bottom: 3px; }
      .page-svg {
        width: 100%;
        display: block;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
        background: white;
      }
      @media (max-width: 820px) {
        main { flex-direction: column; }
        #view3d { flex: none; height: 34vh; }
        #pagesPanel { width: 100%; min-width: 0; flex: 1; border-left: none; border-top: 1px solid var(--border); }
        header { gap: 8px; padding: 8px 10px; }
        header h1 { width: 100%; }
        #warnings { max-width: 90%; }
      }
      button, label.btn {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: white; }
      button:disabled { opacity: 0.45; cursor: default; }
      .ctrl { display: flex; align-items: center; gap: 6px; font-size: 13px; }
      .ctrl input { width: 70px; font: inherit; padding: 4px; border: 1px solid var(--border); border-radius: 4px; }
      .ctrl select { font: inherit; padding: 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--panel); }
      #dropzone {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #888;
        font-size: 15px;
        pointer-events: none;
      }
      #dropzone.hidden { display: none; }
      body.dragging::after {
        content: 'Déposer le fichier ici';
        position: fixed;
        inset: 0;
        background: rgba(176, 83, 42, 0.12);
        border: 3px dashed var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: var(--accent);
        z-index: 10;
      }
      #warnings {
        position: absolute;
        left: 12px;
        bottom: 12px;
        max-width: 60%;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 5;
      }
      .warning {
        background: #fff6e0;
        border: 1px solid #e0c060;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12.5px;
      }
      #stats { font-size: 12.5px; color: #777; }
    </style>
  </head>
  <body>
    <header>
      <h1>Paper Centurion</h1>
      <label class="btn">
        Ouvrir un modèle (STL/OBJ)
        <input type="file" id="fileInput" accept=".stl,.obj,.papier.json,application/json" hidden />
      </label>
      <div class="ctrl">
        <label for="scale">Échelle</label>
        <input type="number" id="scale" value="1" min="0.1" step="0.1" />
        <span>mm/unité</span>
      </div>
      <div class="ctrl">
        <label for="tabDepth">Languettes</label>
        <input type="number" id="tabDepth" value="6" min="1" step="1" />
        <span>mm</span>
      </div>
      <div class="ctrl">
        <label for="pageFormat">Papier</label>
        <select id="pageFormat">
          <option>A5</option>
          <option selected>A4</option>
          <option>A3</option>
          <option>Letter</option>
          <option>Legal</option>
        </select>
        <select id="pageOrientation">
          <option value="portrait" selected>portrait</option>
          <option value="paysage">paysage</option>
        </select>
      </div>
      <button id="maxScale" disabled title="Régler l'échelle au maximum tenant sur une feuille">Échelle max</button>
      <div class="ctrl">
        <span>Exemples :</span>
        <button data-sample="cube.stl">cube</button>
        <button data-sample="icosaedre.stl">icosaèdre</button>
        <button data-sample="tore.stl">tore</button>
      </div>
      <span id="stats"></span>
      <div class="spacer"></div>
      <button id="saveProject" disabled>Fichier projet</button>
      <button id="exportPdf" class="primary" disabled>Exporter le PDF</button>
    </header>
    <main>
      <div id="view3d">
        <div id="dropzone">Glisser-déposer un modèle 3D (STL ou OBJ)<br />ou un fichier projet .papier.json</div>
        <div id="warnings"></div>
      </div>
      <div id="pagesPanel">
        <div id="pagesToolbar">
          <button id="zoomOut" title="Dézoomer">−</button>
          <span id="zoomLevel">100 %</span>
          <button id="zoomIn" title="Zoomer">+</button>
          <button id="zoomReset" title="Taille normale">100 %</button>
          <button id="zoomFit" title="Page entière">Ajuster</button>
          <span class="sep"></span>
          <button id="viewList" class="pressed" title="Pages en colonne">Liste</button>
          <button id="viewGrid" title="Pages en mosaïque">Mosaïque</button>
        </div>
        <div id="pages"></div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
